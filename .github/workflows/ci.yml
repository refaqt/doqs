name: CI

on:
  push:
  pull_request:

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compile check
        run: python -m compileall scripts templates doqs.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Naming check on fixture machine
        run: python scripts/validate_names.py --root tests/fixtures/minimal-machine
      - name: OKH validate on fixture machine
        run: python scripts/validate_okh.py --root tests/fixtures/minimal-machine
      - name: Licence layout on fixture machine
        run: python scripts/validate_licenses.py --root tests/fixtures/minimal-machine
      - name: Licence layout on doqs tools repo
        run: python scripts/validate_licenses.py --root .
      - name: Licence kit is current
        run: python scripts/apply_licenses.py --check --root .
      - name: All gates on the variant family fixture
        run: python scripts/validate_all.py --root tests/fixtures/variant-family
      - name: All gates on the variant machine fixture
        run: python scripts/validate_all.py --root tests/fixtures/variant-machine
      - name: Validate the parts-library fixture
        run: python scripts/validate_all.py --root tests/fixtures/parts-library
      - name: Markdown links resolve
        run: python scripts/validate_links.py --root . --markdown
      - name: One command, on both fixtures
        run: |
          python doqs.py check --root tests/fixtures/variant-family
          python doqs.py check --root tests/fixtures/variant-machine
          python doqs.py check --root tests/fixtures/parts-library
          python doqs.py list
      - name: Generated variant files are current
        run: |
          python scripts/resolve_params.py --root tests/fixtures/variant-family --table --check
          python scripts/resolve_instance.py --root tests/fixtures/variant-machine --check
