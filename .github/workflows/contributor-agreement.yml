#
# It runs the shared contributor agreement check from refaqt/.github.
# Do not change this copy. The original is workflow-templates/contributor-agreement.yml in
# refaqt/.github. A sync job there copies it to .github/workflows/ in every Refaqt repository.
# Do not add steps that check out or run code from the pull request.

name: Contributor agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  check:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        startsWith(github.event.comment.body, 'I have read the Refaqt Contributor Licence Agreement')))
    uses: refaqt/.github/.github/workflows/cla.yml@main
    secrets: inherit
