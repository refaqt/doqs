# Binds BOM rows to things that live outside bom.csv.
# bom.csv keeps its exact 16-column DOQS header; bindings live here.

# The rail comes in discrete stocked lengths. One table row per length gives
# the part number, the price, the mass AND the vendor STEP for that length,
# so adding a length model needs no BOM edit at all.
[[bind]]
id      = "PRF-001"
table   = "tables/hgr20-rail.csv"
key     = "rail_length"
match   = "exact"
columns = ["spec", "unit_mass_g", "brand", "brand_pn"]

# Geometry for the same row. No `cad` key here: the table supplies a different
# STEP per length, and resolve_bom.py picks the one for the selected model.
[[vendor]]
id     = "PRF-001"
source = "https://www.hiwinusa.com/linear-guideways"
terms  = "redistributable"
