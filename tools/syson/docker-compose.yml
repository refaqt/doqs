# Local SysON stack for DOQS machine repos.
# Started by the control panel (syson.bat / `python doqs/scripts/syson.py ui`)
# or `python doqs/scripts/syson.py open`. Do not use `down -v`
# unless you intend to wipe diagrams stored in Postgres.
#
# Official image pin matches https://doc.mbse-syson.org/syson/v2026.7.0/
# SysON images are multi-platform (linux/amd64 and linux/arm64) starting
# with v2026.9.0. For an older image on ARM:
#   set DOCKER_DEFAULT_PLATFORM=linux/amd64
#
# This stack is for a single local user. It has no authentication.

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - syson-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - syson

  app:
    image: "${IMAGE_TAG:-eclipsesyson/syson:v2026.7.0}"
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      database:
        condition: service_healthy
    networks:
      - syson

networks:
  syson:

volumes:
  syson-postgres:
