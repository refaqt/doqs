# An INSTANCE MODULE. This lives in the CONSUMER (machine) repository, at
# modules/<name>/, and it is NOT a submodule — it is your own folder.
#
# A Git submodule is a frozen mirror of another repository: everyone who adds
# it gets identical files, and there is no slot inside it for "my machine wants
# the 500 mm servo version". So the choice lives here instead, in text, beside
# the resolved parameters and resolved BOM that the resolver generates from it:
#
#   python doqs/scripts/resolve_instance.py modules/x-stage
#
# This folder holds the CHOICE, never the DESIGN — no geometry is copied — so
# there is nothing that can drift from the family. In FreeCAD, insert the
# composition assembly as a Variant Link and set Configuration to the model
# below; you get a live parametric model at your own length, in your own
# document, and two instances of the same family can sit at different lengths
# in one machine.
okhv = "OKH-LOSHv1.0"

name = "X Stage"
repo = "https://github.com/ORG/machine/tree/main/modules/x-stage"
version = "0.1.0"
license = "CERN-OHL-S-2.0"
licensor = ["Your Name"]
function = "500 mm servo linear stage providing X travel."

bom = "bom/bom.csv"      # GENERATED by resolve_instance.py, committed

[instance]
family      = "modules/linear-stage"                  # repo-root-relative submodule path
composition = "modules/linear-stage-servo-linear"     # path INSIDE the family
model       = "500mm"                                 # a [[model]] of the core
sku         = "ALS-SL-500"                            # optional, joins catalog.toml
# params    = "cad/params/instance.csv"               # optional extra sparse override
